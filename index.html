<!DOCTYPE html>
<html>
<head>
    <title>For My Angel <3</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            color: #5a3d52;
            overflow: hidden;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.25);
            z-index: -1;
        }

        .card {
            background: rgba(255, 255, 255, 0.8);
            padding: 40px 25px;
            border-radius: 25px;
            width: 80%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            font-size: 35px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            background: #ff8fbd;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <img class="background" src="./bg.jpg">

    <div class="overlay"></div>

    <div class="card">
        <h1>Happy (Belated) Anniversary! 💗</h1>

        <p>
            I decided to do something special this year.
          i hope you like it!! <3
        </p>

        <button onclick="goToLetters()">Click me 💌</button>

<script>
    function goToLetters() {
        window.location.href = "letters.html";
    }
</script>
</p>

<script>
    function showMessage() {
        document.getElementById("secretMessage").style.display = "block";
    }
</script>
    </div>

</body>
</html>
