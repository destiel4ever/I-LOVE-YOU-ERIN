<!DOCTYPE html>
<html>
<head>
    <title>For You 💌</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background-image: url("Arii.gif");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: #5a3d52;
            overflow: hidden;
        }


        /* =========================
           DECORATIONS
        ========================= */

        .deco {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            object-fit: contain;
        }

        .deco1 {
            width: 85px;
            top: 8%;
            left: 2%;
            transform: rotate(-12deg);
        }

        .deco2 {
            width: 75px;
            top: 12%;
            right: 3%;
            transform: rotate(10deg);
        }

        .deco3 {
            width: 90px;
            bottom: 3%;
            left: 3%;
            transform: rotate(-8deg);
        }


        /* =========================
           TITLE
        ========================= */

        h1 {
            position: absolute;
            top: 6%;
            left: 50%;

            transform: translateX(-50%);

            font-size: 48px;
            white-space: nowrap;

            z-index: 5;

            color: #f7a8c4;
        }


        /* =========================
           ENVELOPES
        ========================= */

        .envelope {
            position: absolute;

            width: 220px;

            cursor: pointer;

            z-index: 4;

            transition:
                transform 0.3s ease,
                opacity 0.3s ease;
        }

        .envelope-image {
            display: block;

            width: 100%;
            height: auto;

            pointer-events: none;

            filter:
                drop-shadow(
                    0 12px 25px rgba(0, 0, 0, 0.18)
                );
        }

        .envelope:hover {
            transform: scale(1.08) rotate(2deg);
        }


        /* =========================
           OPENING ANIMATION
        ========================= */

        .envelope.opening {
            animation: envelopeOpen 0.65s ease forwards;
        }

        @keyframes envelopeOpen {

            0% {
                transform: scale(1) rotate(0deg);
            }

            35% {
                transform: scale(1.12) rotate(-2deg);
            }

            100% {
                transform: scale(0.92) rotate(0deg);
                opacity: 0.35;
            }
        }


        /* =========================
           HEART
        ========================= */

        .heart {
            position: absolute;

            left: 50%;
            top: 48%;

            transform:
                translate(-50%, -50%);

            font-size: 38px;

            z-index: 2;

            color: #d85d91;

            pointer-events: none;
        }


        /* =========================
           LETTER POSITIONS
        ========================= */

        .letter-one {
            top: 27%;
            left: 7%;

            transform: rotate(-7deg);
        }

        .letter-two {
            top: 27%;
            right: 7%;

            transform: rotate(7deg);
        }

        .letter-five {
            top: 45%;
            left: 50%;

            transform:
                translateX(-50%)
                rotate(-2deg);

            z-index: 5;
        }

        .letter-three {
            bottom: 7%;
            left: 7%;

            transform: rotate(7deg);
        }

        .letter-four {
            bottom: 7%;
            right: 7%;

            transform: rotate(-7deg);
        }


        /* =========================
           NUMBERS
        ========================= */

        .number {
            position: absolute;

            top: -20px;
            left: -16px;

            width: 42px;
            height: 42px;

            background: white;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 20px;
            font-weight: bold;

            color: #d85d91;

            box-shadow:
                0 5px 12px rgba(0,0,0,0.15);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================
           PHONE
        ========================= */

        @media (max-width: 600px) {

            body {
                overflow: hidden;
            }

            h1 {
                font-size: 36px;
                top: 5%;
            }

            .envelope {
                width: 155px;
            }

            .heart {
                font-size: 28px;
            }

            .letter-one {
                top: 21%;
                left: 5%;
            }

            .letter-two {
                top: 21%;
                right: 5%;
            }

            .letter-five {
                top: 43%;
            }

            .letter-three {
                bottom: 6%;
                left: 5%;
            }

            .letter-four {
                bottom: 6%;
                right: 5%;
            }

            .number {
                width: 34px;
                height: 34px;

                font-size: 16px;

                top: -17px;
                left: -13px;
            }

            .deco1 {
                width: 55px;
                top: 9%;
                left: 1%;
            }

            .deco2 {
                width: 50px;
                top: 12%;
                right: 1%;
            }

            .deco3 {
                width: 55px;
                bottom: 1%;
                left: 1%;
            }
        }

    </style>
</head>


<body>


    <!-- DECORATIONS -->

    <img
        class="deco deco1"
        src="butterfly.png"
        alt=""
    >

    <img
        class="deco deco2"
        src="sparklespink.png"
        alt=""
    >

    <img
        class="deco deco3"
        src="flowers.png"
        alt=""
    >


    <h1>For You 💌</h1>


    <!-- LETTER 1 -->

    <div
        class="envelope letter-one"
        onclick="openEnvelope(this, 'letter1.html')"
    >

        <img
            class="envelope-image"
            src="1envelope.png"
            alt="Letter 1 envelope"
        >

        <div class="number">1</div>

        <div class="heart">♡</div>

    </div>


    <!-- LETTER 2 -->

    <div
        class="envelope letter-two"
        onclick="openEnvelope(this, 'letter2.html')"
    >

        <img
            class="envelope-image"
            src="1envelope.png"
            alt="Letter 2 envelope"
        >

        <div class="number">2</div>

        <div class="heart">♡</div>

    </div>


    <!-- LETTER 5 -->

    <div
        class="envelope letter-five"
        onclick="openEnvelope(this, 'letter5.html')"
    >

        <img
            class="envelope-image"
            src="1envelope.png"
            alt="Letter 5 envelope"
        >

        <div class="number">5</div>

        <div class="heart">♡</div>

    </div>


    <!-- LETTER 3 -->

    <div
        class="envelope letter-three"
        onclick="openEnvelope(this, 'letter3.html')"
    >

        <img
            class="envelope-image"
            src="1envelope.png"
            alt="Letter 3 envelope"
        >

        <div class="number">3</div>

        <div class="heart">♡</div>

    </div>


    <!-- LETTER 4 -->

    <div
        class="envelope letter-four"
        onclick="openEnvelope(this, 'letter4.html')"
    >

        <img
            class="envelope-image"
            src="1envelope.png"
            alt="Letter 4 envelope"
        >

        <div class="number">4</div>

        <div class="heart">♡</div>

    </div>


    <script>

        function openEnvelope(envelope, page) {

            envelope.classList.add("opening");

            setTimeout(function() {

                window.location.href = page;

            }, 500);

        }

    </script>


</body>
</html>
