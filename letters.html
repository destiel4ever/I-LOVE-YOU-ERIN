<!DOCTYPE html>
<html>
<head>

    <title>For You 💌</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background-image: url("Arii.gif");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: #5a3d52;

            overflow: hidden;
        }


        /* =========================
           DECORATIONS
        ========================= */

        .deco {
            position: fixed;

            pointer-events: none;

            z-index: 1;

            object-fit: contain;
        }


        .deco1 {
            width: 85px;
            top: 7%;
            left: 2%;

            transform: rotate(-12deg);
        }


        .deco2 {
            width: 75px;
            top: 10%;
            right: 3%;

            transform: rotate(10deg);
        }


        .deco3 {
            width: 90px;
            bottom: 3%;
            left: 3%;

            transform: rotate(-8deg);
        }


        /* =========================
           TITLE
        ========================= */

        h1 {
            position: absolute;

            top: 4%;
            left: 50%;

            transform: translateX(-50%);

            font-size: 48px;

            white-space: nowrap;

            z-index: 5;

            color: #f7a8c4;

            text-shadow:
                0 3px 10px
                rgba(90, 40, 70, 0.25);
        }


        /* =========================
           ENVELOPES
        ========================= */

        .envelope {
            position: absolute;

            width: 250px;
            height: 167px;

            background-color: transparent;

            border-radius: 14px;

            cursor: pointer;

            transition:
                transform 0.3s ease,
                opacity 0.3s ease;

            background-image:
                url("1786906870552.png");

            background-size: contain;

            background-position: center;

            background-repeat: no-repeat;

            z-index: 4;
        }


        .envelope:hover {
            transform:
                scale(1.06)
                rotate(2deg);
        }


        /* =========================
           OPENING ANIMATION
        ========================= */

        .envelope.opening {
            animation:
                envelopeOpen
                0.65s
                ease
                forwards;
        }


        @keyframes envelopeOpen {

            0% {
                transform:
                    scale(1)
                    rotate(0deg);

                opacity: 1;
            }

            35% {
                transform:
                    scale(1.08)
                    rotate(-2deg);

                opacity: 1;
            }

            100% {
                transform:
                    scale(0.92)
                    rotate(0deg);

                opacity: 0.35;
            }
        }


        /* =========================
           HEART
        ========================= */

        .heart {
            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            font-size: 40px;

            z-index: 5;

            color: #d85d91;

            text-shadow:
                0 2px 5px
                rgba(0,0,0,0.12);
        }


        /* =========================
           NUMBERS
        ========================= */

        .number {
            position: absolute;

            top: -18px;
            left: -18px;

            width: 45px;
            height: 45px;

            background: white;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 21px;

            font-weight: bold;

            color: #d85d91;

            box-shadow:
                0 6px 14px
                rgba(0,0,0,0.18);

            z-index: 10;
        }


        /* =========================
           LETTER POSITIONS
        ========================= */

        .letter-one {
            top: 24%;
            left: 5%;

            transform:
                rotate(-6deg);
        }


        .letter-two {
            top: 24%;
            right: 5%;

            transform:
                rotate(6deg);
        }


        .letter-five {
            top: 47%;
            left: 50%;

            transform:
                translateX(-50%)
                rotate(-2deg);

            z-index: 5;
        }


        .letter-three {
            bottom: 5%;
            left: 5%;

            transform:
                rotate(6deg);
        }


        .letter-four {
            bottom: 5%;
            right: 5%;

            transform:
                rotate(-6deg);
        }


        /* =========================
           PHONE
        ========================= */

        @media (max-width: 600px) {

            body {
                overflow: hidden;
            }


            h1 {
                font-size: 34px;
                top: 4%;
            }


            .envelope {
                width: 170px;
                height: 114px;
            }


            .heart {
                font-size: 29px;
            }


            .number {
                width: 34px;
                height: 34px;

                top: -14px;
                left: -13px;

                font-size: 16px;
            }


            .letter-one {
                top: 19%;
                left: 3%;
            }


            .letter-two {
                top: 19%;
                right: 3%;
            }


            .letter-five {
                top: 43%;
                left: 50%;
            }


            .letter-three {
                bottom: 7%;
                left: 3%;
            }


            .letter-four {
                bottom: 7%;
                right: 3%;
            }


            .deco1 {
                width: 52px;
                top: 8%;
                left: 1%;
            }


            .deco2 {
                width: 48px;
                top: 10%;
                right: 1%;
            }


            .deco3 {
                width: 55px;
                bottom: 1%;
                left: 1%;
            }

        }


        /* =========================
           VERY SMALL PHONES
        ========================= */

        @media (max-width: 420px) {

            h1 {
                font-size: 29px;
            }


            .envelope {
                width: 155px;
                height: 104px;
            }


            .heart {
                font-size: 26px;
            }


            .letter-one {
                left: 2%;
                top: 19%;
            }


            .letter-two {
                right: 2%;
                top: 19%;
            }


            .letter-five {
                top: 43%;
            }


            .letter-three {
                left: 2%;
                bottom: 7%;
            }


            .letter-four {
                right: 2%;
                bottom: 7%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         DECORATIONS
    ========================= -->

    <img
        class="deco deco1"
        src="butterfly.png"
        alt=""
    >


    <img
        class="deco deco2"
        src="sparklespink.png"
        alt=""
    >


    <img
        class="deco deco3"
        src="flowers.png"
        alt=""
    >



    <!-- =========================
         TITLE
    ========================= -->

    <h1>
        For You 💌
    </h1>



    <!-- =========================
         LETTER 1
    ========================= -->

    <div
        class="envelope letter-one"
        onclick="openEnvelope(this, 'letter1.html')"
    >

        <div class="number">
            1
        </div>

        <div class="heart">
            ♡
        </div>

    </div>



    <!-- =========================
         LETTER 2
    ========================= -->

    <div
        class="envelope letter-two"
        onclick="openEnvelope(this, 'letter2.html')"
    >

        <div class="number">
            2
        </div>

        <div class="heart">
            ♡
        </div>

    </div>



    <!-- =========================
         LETTER 5
    ========================= -->

    <div
        class="envelope letter-five"
        onclick="openEnvelope(this, 'letter5.html')"
    >

        <div class="number">
            5
        </div>

        <div class="heart">
            ♡
        </div>

    </div>



    <!-- =========================
         LETTER 3
    ========================= -->

    <div
        class="envelope letter-three"
        onclick="openEnvelope(this, 'letter3.html')"
    >

        <div class="number">
            3
        </div>

        <div class="heart">
            ♡
        </div>

    </div>



    <!-- =========================
         LETTER 4
    ========================= -->

    <div
        class="envelope letter-four"
        onclick="openEnvelope(this, 'letter4.html')"
    >

        <div class="number">
            4
        </div>

        <div class="heart">
            ♡
        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        function openEnvelope(envelope, page) {

            envelope.classList.add("opening");

            setTimeout(function() {

                window.location.href = page;

            }, 500);

        }

    </script>


</body>

</html>
